        x="20"
        y="10"
        width="60"
        height="80"
        rx="8"
        fill="#ffffff"
        stroke="#6366f1"
        stroke-width="6"
    />

    <!-- Notebook lines -->
    <line
        x1="35"
        y1="35"
        x2="68"
        y2="35"
        stroke="#6366f1"
        stroke-width="5"
    />

    <line
        x1="35"
        y1="52"
        x2="68"
        y2="52"
