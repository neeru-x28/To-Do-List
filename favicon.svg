    />

    <line
        x1="35"
        y1="69"
        x2="55"
        y2="69"
        stroke="#6366f1"
        stroke-width="5"
    />

    <!-- Check marks -->
    <path
        d="M25 34 L29 38 L35 30"
        fill="none"
        stroke="#22c55e"
        stroke-width="4"
    />

    <path
        d="M25 51 L29 55 L35 47"
